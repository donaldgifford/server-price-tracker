[tools]
# Go Packages
"go:github.com/spf13/cobra-cli" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:github.com/vektra/mockery/v2" = "latest"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1020" # must match github.com/a-h/templ in go.mod — bump in lockstep with go.mod, Dockerfile, and .goreleaser.yml (newer CLI emits code referencing APIs not in older library)

# API testing tools
"npm:@apideck/portman" = "latest" # Postman collection + contract tests from OpenAPI
"npm:newman" = "latest"           # Postman CLI test runner

go = "1.27.1"
markdownlint-cli2 = "0.23.3"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
yq = "4.53.6"
prettier = "3.9.9"
golines = "latest"
golangci-lint = "2.14.0"
actionlint = "latest"

# helm
helm = "3.22.0"
helm-cr = "latest"
helm-ct = "latest"
helm-diff = "latest"
helm-docs = "latest"

# repo tools
"github:donaldgifford/docz" = "latest"

# Security
syft = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

# Compliance
"go:github.com/google/go-licenses" = "latest"
